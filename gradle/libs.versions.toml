[versions]
kotlin = "2.1.21"
koog = "1.0.0"
kotlinx-serialization = "1.8.1"
kotlinx-coroutines = "1.10.2"
logback = "1.5.18"
shadow = "8.1.1"
kotlin-logging = "7.0.7"
junit = "5.10.2"

[libraries]
koog-agents = { module = "ai.koog:koog-agents", version.ref = "koog" }
koog-deepseek-client = { module = "ai.koog:prompt-executor-deepseek-client", version = "1.0.0-beta-preview7" }
koog-openrouter-client = { module = "ai.koog:prompt-executor-openrouter-client", version.ref = "koog" }
koog-anthropic-client = { module = "ai.koog:prompt-executor-anthropic-client", version.ref = "koog" }
koog-ollama-client = { module = "ai.koog:prompt-executor-ollama-client", version.ref = "koog" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging", version.ref = "kotlin-logging" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
koog-agents-test = { module = "ai.koog:agents-test", version.ref = "koog" }

[plugins]
shadow = { id = "com.github.johnrengelman.shadow", version.ref = "shadow" }
